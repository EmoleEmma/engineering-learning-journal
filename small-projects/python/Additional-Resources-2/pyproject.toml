[project]
name = "student-management"
version = "0.1.0"
description = "A small student management practice project"
requires-python = ">=3.10"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # errors, pyflakes, import sorting, pyupgrade
ignore = []